name: PR Size Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by size
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/pr-size-labeler.yml
          sync-labels: true

      - name: Calculate PR size metrics
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const totalAdditions = files.reduce((sum, f) => sum + f.additions, 0);
            const totalDeletions = files.reduce((sum, f) => sum + f.deletions, 0);
            const totalChanges = totalAdditions + totalDeletions;
            const changedFiles = files.length;

            let sizeLabel;
            if (totalChanges <= 10) {
              sizeLabel = 'size/xs';
            } else if (totalChanges <= 50) {
              sizeLabel = 'size/s';
            } else if (totalChanges <= 200) {
              sizeLabel = 'size/m';
            } else if (totalChanges <= 500) {
              sizeLabel = 'size/l';
            } else {
              sizeLabel = 'size/xl';
            }

            const existingLabels = pr.labels.map(l => l.name);
            const sizeLabels = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl'];

            const labelsToRemove = existingLabels.filter(l => sizeLabels.includes(l) && l !== sizeLabel);
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch {}
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel]
            });

            const commentBody = `## PR Size Metrics
            - **Files Changed:** ${changedFiles}
            - **Additions:** ${totalAdditions}
            - **Deletions:** ${totalDeletions}
            - **Total Changes:** ${totalChanges}
            - **Size Category:** ${sizeLabel}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Size Metrics')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
              });
            }
