name: First Interaction Greeter

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = context.payload.issue !== undefined;
            const author = isIssue
              ? context.payload.issue.user.login
              : context.payload.pull_request.user.login;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              state: 'all',
              per_page: 1
            });

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${author}:`,
              per_page: 1
            });

            const totalContributions = issues.length + prs.length;

            if (totalContributions > 1) {
              console.log(`Returning contributor ${author}, skipping welcome.`);
              return;
            }

            const welcomeMessage = `👋 Welcome to UI-Verse, @${author}!

Thank you for taking the time to contribute to our open-source component library! We're excited to have you here.

### Quick Start Resources
- 📖 **[Contribution Guide](https://github.com/Tushar-sonawane06/UI-Verse/blob/main/Docs/CONTRIBUTING.md)**
- 🏗️ **[Architecture Overview](https://github.com/Tushar-sonawane06/UI-Verse/blob/main/Docs/ARCHITECTURE.md)**
- 💬 **Join our community** — check the README for discussion links

### What Happens Next?
1. A maintainer will review your ${isIssue ? 'issue' : 'pull request'} shortly
2. If you need help, feel free to ask questions in the comments
3. Don't forget to ⭐ star the repository if you find it useful!

Happy contributing! 🚀`;

            if (isIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: welcomeMessage
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: welcomeMessage
              });
            }
