# UI-Verse Path Labeler Configuration
# Labels are automatically applied based on changed file paths.

# Core source
TypeScript:
  - src/**/*.ts
  - src/**/*.tsx

JavaScript Modules:
  - js/**/*.js
  - js/features/**/*.js
  - js/core/**/*.js

Web Components:
  - src/components/**/*

# Styles
CSS:
  - css/**/*.css
  - themes/**/*.css
  - components/**/*.css

# HTML Pages
HTML:
  - '*.html'
  - components/**/*.html

# Documentation
documentation:
  - '*.md'
  - Docs/**/*
  - docs/**/*

# CI/CD
CI/CD:
  - .github/**/*
  - .github/workflows/**/*

# Tests
tests:
  - tests/**/*
  - test/**/*

# Build & Config
build:
  - package.json
  - rollup.config.mjs
  - vite.config.js
  - tsconfig.json
  - '*.json'
  - '*.mjs'

# Design Tokens
design-tokens:
  - design-tokens.css
  - src/design-tokens.ts
  - data/design-tokens.json

# Internationalization
i18n:
  - locales/**/*
  - src/i18n/**/*
  - src/locales/**/*

# Accessibility
accessibility:
  - scripts/a11y-*.js
  - scripts/a11y-*.mjs
  - js/features/accessibility.js

# Storybook
storybook:
  - stories/**/*
  - .storybook/**/*

# Scripts
scripts:
  - scripts/**/*

# Performance
performance:
  - scripts/perf-*.js
  - .lighthouserc.json
  - perf-budgets.json

# Security
security:
  - scripts/security-*.js
  - scripts/csp-*.js

# Docker / Dev Environment
docker:
  - Dockerfile
  - docker-compose.yml
  - .dockerignore
  - .devcontainer/**/*
