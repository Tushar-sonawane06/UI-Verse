# UI-Verse Docker Compose Development Environment
# Provides a fully containerized setup for local development and testing

services:
  # Main development server with Vite hot-reload
  dev:
    build:
      context: .
      target: development
    container_name: uiverse-dev
    ports:
      - "5173:5173"   # Vite dev server
      - "6006:6006"   # Storybook
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Production-like static server (nginx)
  prod:
    build:
      context: .
      target: production
    container_name: uiverse-prod
    ports:
      - "8080:80"
    depends_on:
      - builder

  # Build stage (produces static assets)
  builder:
    build:
      context: .
      target: builder
    container_name: uiverse-builder
    volumes:
      - build-output:/app/dist
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run build"

  # Storybook server
  storybook:
    build:
      context: .
      target: development
    container_name: uiverse-storybook
    ports:
      - "6006:6006"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run storybook"
    profiles:
      - storybook

  # Playwright test runner
  test:
    build:
      context: .
      target: testing
    container_name: uiverse-test
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npx playwright install chromium --with-deps && npm run test:visual:core"
    profiles:
      - testing

volumes:
  node_modules:
  build-output:
